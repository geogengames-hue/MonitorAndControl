<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor & Control Login</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  background: #0d100f;
  color: #e8ecea;
}
.login-shell {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr);
  width: min(920px, calc(100vw - 40px));
  min-height: 510px;
  overflow: hidden;
  border: 1px solid #2b3531;
  border-radius: 14px;
  background: #171c1a;
  box-shadow: 0 35px 100px rgba(0,0,0,.38);
  animation: login-arrive .55s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes login-arrive { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.login-story {
  position: relative;
  overflow: hidden;
  padding: 54px;
  background: linear-gradient(145deg,#25271f 0%,#1c201c 55%,#171c1a 100%);
}
.login-story::before, .login-story::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(240,164,93,.14);
  border-radius: 50%;
}
.login-story::before { width: 390px; height: 390px; right: -190px; bottom: -175px; box-shadow: 0 0 90px rgba(240,164,93,.08); }
.login-story::after { width: 230px; height: 230px; right: -90px; bottom: -95px; border-style: dashed; animation: story-orbit 24s linear infinite; }
@keyframes story-orbit { to { transform: rotate(360deg); } }
.story-brand { color: #f0a45d; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
.login-story h2 { max-width: 370px; margin: 92px 0 17px; color: #f1f1ec; font-size: 42px; font-weight: 560; line-height: 1.04; letter-spacing: -.045em; }
.login-story p { max-width: 355px; color: #929b96; font-size: 14px; line-height: 1.65; }
.story-status { display: flex; align-items: center; gap: 9px; margin-top: 42px; color: #aab3ae; font-size: 11px; font-weight: 650; }
.story-status i { width: 7px; height: 7px; border-radius: 50%; background: #58bd83; box-shadow: 0 0 0 5px rgba(88,189,131,.09),0 0 18px rgba(88,189,131,.4); }
.login {
  align-self: center;
  width: 100%;
  padding: 58px;
  background: transparent;
}
.logo {
  color: #f0a45d;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  margin-bottom: 12px;
  text-transform: uppercase;
}
h1 {
  margin: 0 0 18px;
  color: #e8ecea;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -.02em;
}
label {
  display: block;
  margin-bottom: 8px;
  color: #b5beb9;
  font-size: 13px;
}
input, button {
  width: 100%;
  border-radius: 6px;
  font-size: 14px;
  padding: 12px 14px;
}
input {
  background: #222a27;
  color: #e8ecea;
  border: 1px solid #3a4641;
  margin-bottom: 14px;
  outline: none;
}
input:focus { border-color: #f0a45d; box-shadow: 0 0 0 3px rgba(240,164,93,.11); }
button {
  border: 1px solid transparent;
  background: #f0a45d;
  color: #08110e;
  cursor: pointer;
  font-weight: 700;
}
button:hover { background: #f6b574; }
button:active { transform: scale(.98); }
button:disabled {
  cursor: default;
  opacity: 0.65;
}
.message {
  min-height: 20px;
  margin-top: 14px;
  color: #d9a441;
  font-size: 13px;
  line-height: 1.4;
}
.message.error { color: #e1807b; }
@media (max-width: 760px) {
  .login-shell { display: block; width: min(430px,calc(100vw - 28px)); min-height: 0; }
  .login-story { padding: 25px 28px; }
  .login-story h2, .login-story p, .story-status { display: none; }
  .login { padding: 34px 28px 38px; }
}
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<main class="login-shell">
  <section class="login-story">
    <div class="story-brand">Monitor &amp; Control</div>
    <h2>Clarity for parents. Freedom with boundaries.</h2>
    <p>One private control center for healthy screen-time limits, schedules, and transparent activity.</p>
    <div class="story-status"><i></i>Protected local dashboard</div>
  </section>
  <section class="login">
    <div class="logo">Secure access</div>
    <h1>Welcome back</h1>
    <form id="login-form">
      <label for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" autofocus>
      <button id="login-button" type="submit">Open control center</button>
    </form>
    <div id="message" class="message"></div>
  </section>
</main>
<script>
const form = document.getElementById('login-form');
const button = document.getElementById('login-button');
const password = document.getElementById('password');
const message = document.getElementById('message');

async function checkStatus() {
  try {
    const response = await fetch('/api/auth/status', { cache: 'no-store' });
    if (!response.ok) return;
    const status = await response.json();
    if (!status.passwordSet) {
      button.disabled = true;
      password.disabled = true;
      message.className = 'message error';
      message.textContent = 'Admin password is not set. Open the dashboard locally before enabling remote access.';
    }
  } catch {
  }
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  message.textContent = '';
  message.className = 'message';
  button.disabled = true;

  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password.value })
    });

    if (!response.ok) {
      let error = 'Login failed.';
      try {
        const body = await response.json();
        if (body.error) error = body.error;
      } catch {
      }
      message.className = 'message error';
      message.textContent = error;
      return;
    }

    await response.json();
    window.location.replace('/index.html');
  } finally {
    button.disabled = false;
  }
});

checkStatus();
</script>
</body>
</html>

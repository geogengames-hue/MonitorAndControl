name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore .\MonitorAndControl.csproj

    - name: Build (Release)
      run: dotnet build .\MonitorAndControl.csproj -c Release --no-restore

    - name: Run tests
      run: dotnet run --project .\Tests\MonitorAndControl.Tests.csproj -c Release

    - name: Publish and sign all components & installer
      shell: pwsh
      env:
        CODE_SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
        CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
      run: |
        .\publish.ps1

    - name: Upload artifacts (publish folder)
      uses: actions/upload-artifact@v4
      with:
        name: MonitorAndControl
        path: bin/Release/net8.0-windows/win-x64/publish/

    - name: Upload single-file installer
      uses: actions/upload-artifact@v4
      with:
        name: MonitorAndControlSetup
        path: bin/Release/net8.0-windows/win-x64/installer/MonitorAndControlSetup.exe
